version: '3.8'

services:
  mongo:
    image: mongo:5.0
    container_name: mongo_db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - ecommerce-net

  backend:
    build: ./backend
    container_name: backend_app
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/ecommerce
      - PORT=5000
    networks:
      - ecommerce-net

  frontend:
    build:
      context: ./frontend
      args:
        # For local development, we point to the backend service directly
        - REACT_APP_API_URL=http://localhost:5000/api
    container_name: frontend_app
    ports:
      - "3000:80"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    networks:
      - ecommerce-net

volumes:
  mongo-data:

networks:
  ecommerce-net:
    driver: bridge
