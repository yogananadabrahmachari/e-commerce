name: E-commerce CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      # --- Docker Build and Push Steps for Backend ---
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend # Path to your backend Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:latest,${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:${{ github.sha }}
          # You can also add a version tag like 'v1.0' here if you prefer
          # tags: ${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:v1.0,${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:latest,${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build production app
        run: npm run build

      # --- Docker Build and Push Steps for Frontend ---
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend # Path to your frontend Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ecommerce-frontend:latest,${{ secrets.DOCKER_USERNAME }}/ecommerce-frontend:${{ github.sha }}
          # You can also add a version tag like 'v1.0' here if you prefer
          # tags: ${{ secrets.DOCKER_USERNAME }}/ecommerce-frontend:v1.0,${{ secrets.DOCKER_USERNAME }}/ecommerce-frontend:latest,${{ secrets.DOCKER_USERNAME }}/ecommerce-frontend:${{ github.sha }}
